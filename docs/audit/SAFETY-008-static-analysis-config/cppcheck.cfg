<?xml version="1.0"?>
<!--
  Cppcheck Project Configuration for UVCCamera Memory Safety Audit
  AUDIT-002 / SAFETY-008

  Usage:
    cppcheck --project=cppcheck.cfg --enable=all --xml --xml-version=2 2>report.xml
    cppcheck --project=cppcheck.cfg --enable=all --template='{file}:{line}: {severity}: {message} [{id}]'
-->
<project version="1">
  <!-- Target directory -->
  <root name="../../lib/src/main/jni/UVCCamera"/>

  <!-- Include paths -->
  <includedir>
    <dir name="../../lib/src/main/jni/UVCCamera"/>
    <dir name="../../lib/src/main/jni/libuvc/include"/>
    <dir name="../../lib/src/main/jni/libusb/libusb"/>
    <dir name="../../lib/src/main/jni/libjpeg-turbo-1.5.0"/>
  </includedir>

  <!-- Preprocessor defines for Android NDK -->
  <defines>
    <def name="ANDROID"/>
    <def name="ANDROID_NDK"/>
    <def name="__ANDROID__"/>
    <def name="__arm__"/>
    <def name="__SIZEOF_POINTER__=4"/>
  </defines>

  <!-- File patterns to check -->
  <paths>
    <dir name="."/>
  </paths>

  <!-- Suppressions for known issues -->
  <suppressions>
    <suppression>missingIncludeSystem</suppression>
    <!-- Third-party code -->
    <suppression fileName="*/libjpeg-turbo-*/*"/>
    <suppression fileName="*/libusb/*"/>
    <suppression fileName="*/libuvc/*"/>
  </suppressions>

  <!-- Checks to enable -->
  <addons>
    <addon>threadsafety</addon>
    <addon>cert</addon>
  </addons>
</project>
